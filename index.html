<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profit Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding: 40px 24px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 30%, #0f1a3a 0%, #080c1a 100%);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            font-size: 36px;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 11px;
            font-weight: 400;
            color: #4a6a9f;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .header-sub {
            font-size: 18px;
            font-weight: 600;
            color: #7a9fd8;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* ===== MAIN STATUS ===== */
        .status-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 200px;
        }

        .status-main {
            font-size: 26px;
            font-weight: 700;
            color: #d0e0ff;
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .status-main .highlight {
            color: #5a8fd4;
        }

        .status-sub {
            font-size: 13px;
            color: #4a6a8f;
            margin-top: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== ANALYZING ANIMATION ===== */
        .analyzing-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .analyzing-wrapper.active {
            display: flex;
            animation: pulseBlue 1.2s ease-in-out infinite;
        }

        @keyframes pulseBlue {
            0% { opacity: 0.6; text-shadow: 0 0 10px rgba(70, 130, 255, 0.1); }
            50% { opacity: 1; text-shadow: 0 0 40px rgba(70, 130, 255, 0.5), 0 0 80px rgba(70, 130, 255, 0.15); }
            100% { opacity: 0.6; text-shadow: 0 0 10px rgba(70, 130, 255, 0.1); }
        }

        .analyzing-icon {
            font-size: 48px;
            margin-bottom: 16px;
            animation: spinPulse 2s ease-in-out infinite;
        }

        @keyframes spinPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.1) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 0.6; }
        }

        .analyzing-text {
            font-size: 20px;
            font-weight: 600;
            color: #5a8fd4;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .analyzing-dots {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .analyzing-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a5a9f;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .analyzing-dots span:nth-child(2) { animation-delay: 0.3s; }
        .analyzing-dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; background: #2a5a9f; }
            40% { transform: scale(1.2); opacity: 1; background: #5a8fd4; box-shadow: 0 0 20px rgba(70, 130, 255, 0.4); }
        }

        /* ===== SIGNAL CARD ===== */
        .signal-card {
            background: linear-gradient(145deg, rgba(20, 40, 80, 0.6), rgba(10, 20, 50, 0.8));
            border: 1px solid rgba(70, 130, 255, 0.15);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            backdrop-filter: blur(12px);
            display: none;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 8px 40px rgba(20, 60, 140, 0.15);
        }

        .signal-card.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signal-asset {
            font-size: 20px;
            font-weight: 700;
            color: #d0e0ff;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .signal-asset .badge {
            font-size: 10px;
            color: #4a8acf;
            font-weight: 400;
            background: rgba(70, 130, 255, 0.12);
            padding: 2px 14px;
            border-radius: 20px;
            margin-left: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .signal-direction {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .signal-arrow {
            font-size: 42px;
            font-weight: 300;
            transition: color 0.3s;
        }

        .signal-arrow.up { color: #4fc3f7; }
        .signal-arrow.down { color: #ef5350; }

        .signal-dir-text {
            font-size: 22px;
            font-weight: 700;
            color: #d0e0ff;
            letter-spacing: 2px;
        }

        .signal-details {
            display: flex;
            justify-content: space-around;
            padding-top: 16px;
            border-top: 1px solid rgba(70, 130, 255, 0.08);
        }

        .signal-detail {
            text-align: center;
        }

        .signal-detail .label {
            font-size: 9px;
            color: #4a6a8f;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .signal-detail .value {
            font-size: 18px;
            font-weight: 700;
            color: #d0e0ff;
            margin-top: 2px;
        }

        .signal-detail .value.accent {
            color: #4fc3f7;
        }

        /* ===== BUTTON ===== */
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #1a3a7a, #0f2a5a);
            color: #b0ccee;
            box-shadow: 0 4px 30px rgba(30, 80, 180, 0.15);
            margin-top: 28px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 160, 255, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 40px rgba(30, 80, 180, 0.25);
            background: linear-gradient(135deg, #1f4a8a, #123a6a);
            color: #d0e0ff;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .action-btn.loading {
            background: linear-gradient(135deg, #0f1a3a, #1a2a5a);
            color: #4a6a8f;
        }

        /* ===== FOOTER ===== */
        .footer {
            font-size: 9px;
            color: #1a2a4a;
            text-align: center;
            margin-top: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .container { padding: 30px 16px; }
            .status-main { font-size: 22px; }
            .signal-asset { font-size: 17px; }
            .signal-arrow { font-size: 34px; }
            .signal-dir-text { font-size: 18px; }
            .signal-detail .value { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="header-icon">📊</div>
        <div class="header-title">Profit Scanner</div>
        <div class="header-sub">ANALYZER</div>
    </div>

    <!-- STATUS AREA -->
    <div class="status-area" id="statusArea">

        <!-- DEFAULT STATUS -->
        <div id="defaultStatus">
            <div class="status-main">
                GOOD LUCK<br><span class="highlight">TRADING</span>
            </div>
            <div class="status-sub">System ready</div>
        </div>

        <!-- ANALYZING STATE -->
        <div class="analyzing-wrapper" id="analyzingWrapper">
            <div class="analyzing-icon">⟳</div>
            <div class="analyzing-text">Analyzing</div>
            <div class="analyzing-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="status-sub" style="margin-top: 16px; font-size: 11px; color: #3a5a7a;">
                Volatility analysis in progress
            </div>
        </div>
    </div>

    <!-- SIGNAL CARD -->
    <div class="signal-card" id="signalCard">
        <div class="signal-asset">
            <span id="signalAsset">BTC/USD</span>
            <span class="badge">OTC</span>
        </div>
        <div class="signal-direction">
            <span class="signal-arrow up" id="signalArrow">↑</span>
            <span class="signal-dir-text" id="signalDir">BUY</span>
        </div>
        <div class="signal-details">
            <div class="signal-detail">
                <div class="label">Time</div>
                <div class="value" id="signalTime">5 MIN</div>
            </div>
            <div class="signal-detail">
                <div class="label">Profit</div>
                <div class="value accent" id="signalProfit">87%</div>
            </div>
            <div class="signal-detail">
                <div class="label">Confidence</div>
                <div class="value accent" id="signalConfidence">92%</div>
            </div>
        </div>
    </div>

    <!-- BUTTON -->
    <button class="action-btn" id="actionBtn">
        <span id="btnText">GET SIGNAL</span>
    </button>

    <div class="footer">v1.0 • secured</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tg = window.Telegram.WebApp;
        tg.expand();

        const defaultStatus = document.getElementById('defaultStatus');
        const analyzingWrapper = document.getElementById('analyzingWrapper');
        const signalCard = document.getElementById('signalCard');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');

        const signalAsset = document.getElementById('signalAsset');
        const signalArrow = document.getElementById('signalArrow');
        const signalDir = document.getElementById('signalDir');
        const signalTime = document.getElementById('signalTime');
        const signalProfit = document.getElementById('signalProfit');
        const signalConfidence = document.getElementById('signalConfidence');

        let isAnalyzing = false;

        const assets = [
            { name: 'BTC/USD', dir: 'up' },
            { name: 'ETH/USD', dir: 'up' },
            { name: 'EUR/USD', dir: 'down' },
            { name: 'GBP/JPY', dir: 'up' },
            { name: 'USD/CAD', dir: 'up' },
            { name: 'AUD/USD', dir: 'down' },
            { name: 'XAU/USD', dir: 'up' },
            { name: 'USD/JPY', dir: 'down' }
        ];

        const directions = ['BUY', 'SELL'];
        const timeframes = ['3 MIN', '5 MIN', '10 MIN'];
        const profits = ['85%', '87%', '90%', '92%'];
        const confidences = ['82%', '87%', '91%', '95%'];

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function showAnalyzing() {
            isAnalyzing = true;
            defaultStatus.style.display = 'none';
            analyzingWrapper.classList.add('active');
            signalCard.classList.remove('show');
            actionBtn.disabled = true;
            actionBtn.classList.add('loading');
            btnText.textContent = 'ANALYZING';
        }

        function showSignal() {
            const asset = getRandom(assets);
            const direction = getRandom(directions);
            const isUp = direction === 'BUY';

            signalAsset.textContent = asset.name;
            signalArrow.textContent = isUp ? '↑' : '↓';
            signalArrow.className = `signal-arrow ${isUp ? 'up' : 'down'}`;
            signalDir.textContent = direction;
            signalTime.textContent = getRandom(timeframes);
            signalProfit.textContent = getRandom(profits);
            signalConfidence.textContent = getRandom(confidences);

            analyzingWrapper.classList.remove('active');
            defaultStatus.style.display = 'none';
            signalCard.classList.add('show');
            actionBtn.disabled = false;
            actionBtn.classList.remove('loading');
            btnText.textContent = 'NEW SIGNAL';
            isAnalyzing = false;

            tg.sendData(JSON.stringify({
                action: 'get_signal',
                asset: asset.name,
                direction: direction
            }));
        }

        function resetToStart() {
            isAnalyzing = false;
            defaultStatus.style.display = 'block';
            analyzingWrapper.classList.remove('active');
            signalCard.classList.remove('show');
            actionBtn.disabled = false;
            actionBtn.classList.remove('loading');
            btnText.textContent = 'GET SIGNAL';
        }

        actionBtn.addEventListener('click', function() {
            if (isAnalyzing) return;

            if (btnText.textContent === 'GET SIGNAL' || btnText.textContent === 'NEW SIGNAL') {
                showAnalyzing();
                setTimeout(showSignal, 2200);
            }
        });

        // Initial state
        resetToStart();
    });
</script>

</body>
</html>
